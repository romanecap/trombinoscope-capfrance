<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#006eaa">
<title>Carnet d’adresses Capfrance</title>
<style>
:root{--b:#006eaa;--p:#f4b2bc;--ink:#153441;--muted:#6d7f88;--bg:#f3f7f9;--line:#e0e8ec;--white:#fff;--shadow:0 10px 30px rgba(22,61,78,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
button,input,select{font:inherit}.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand,.searcharea,main{max-width:1140px;margin:auto}.brand{padding:12px 16px 9px;display:flex;align-items:center;gap:13px}.logo{width:104px}.brand h1{font-size:17px;margin:0;font-weight:900;letter-spacing:-.3px}.brand p{font-size:11.5px;color:var(--muted);margin:3px 0 0}
.searcharea{padding:0 16px 12px}.searchwrap{position:relative}.search{width:100%;height:49px;border:1px solid #d3e0e6;border-radius:16px;background:#fafdfe;padding:0 43px;font-size:15px;outline:none;transition:.2s}.search:focus{background:#fff;border-color:var(--b);box-shadow:0 0 0 4px rgba(0,110,170,.09)}.mag{position:absolute;left:15px;top:14px;font-size:18px;color:var(--b)}.clear{display:none;position:absolute;right:8px;top:7px;width:35px;height:35px;border:0;background:transparent;border-radius:50%;font-size:20px;color:#71838c}
main{padding:14px 14px 45px}.filters{background:#fff;border:1px solid var(--line);border-radius:19px;padding:13px;box-shadow:0 4px 18px rgba(22,61,78,.04)}.filterhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.filterhead b{font-size:13px}.reset{border:0;background:#eef6fa;color:var(--b);border-radius:99px;padding:7px 10px;font-size:10.5px;font-weight:850;cursor:pointer}
.fields{display:grid;grid-template-columns:1fr;gap:9px}.field label{display:block;margin:0 0 5px 3px;font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.55px;color:#7a8b93}.field select{width:100%;height:42px;border:1px solid #dbe5ea;background:#fff;border-radius:12px;padding:0 10px;color:var(--ink);font-size:12px;font-weight:700;outline:none}.field select:focus{border-color:var(--b)}
.quicktitle{font-size:10px;font-weight:900;color:#7a8b93;text-transform:uppercase;letter-spacing:.55px;margin:13px 2px 0}.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 1px 1px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #dce5e9;background:#fff;color:#49606b;border-radius:999px;padding:8px 10px;font-size:10.5px;font-weight:850;cursor:pointer}.chip.on{background:var(--b);border-color:var(--b);color:#fff}.chip small{opacity:.7;margin-left:3px}
.summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px 10px}.count{font-size:12px;color:var(--muted)}.count b{font-size:15px;color:var(--ink)}.sort{border:0;background:transparent;color:var(--b);font-size:11px;font-weight:800;max-width:145px}
.activefilters{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}.activefilters:empty{display:none}.tag{background:#eaf4f8;color:#315969;border-radius:99px;padding:5px 8px;font-size:9.5px;font-weight:750}
.grid{display:grid;grid-template-columns:1fr;gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;box-shadow:0 3px 14px rgba(22,61,78,.035);transition:.18s}.card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#e4f2f8,#fde8ed);color:var(--b);font-size:18px;font-weight:900;box-shadow:0 0 0 1px #d9e7ed}.name{font-size:14px;font-weight:900;line-height:1.2}.est{font-size:11.3px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mail-link{display:block;margin-top:6px;color:var(--b);text-decoration:none;font-size:10.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mail-link:hover{text-decoration:underline}.badge{display:inline-block;max-width:100%;margin-top:7px;border-radius:999px;padding:5px 8px;font-size:9.3px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir{background:#006eaa;color:#fff}.adj{background:#cde6f1;color:#17485e}.com{background:#f4b2bc;color:#59343c}.adm{background:#d98c9d;color:#fff}.exp{background:#dceef4;color:#245264}.guest{background:#f6e7b7;color:#5d4c1b}.other{background:#e7ebed;color:#52636c}
.empty{display:none;text-align:center;background:#fff;border:1px dashed #cbd9df;border-radius:18px;padding:50px 20px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.footer{text-align:center;color:#94a2a9;font-size:9.5px;margin-top:24px}
@media(min-width:650px){main{padding:18px}.fields{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}.avatar img{width:100%;height:100%;object-fit:cover;display:block}@media(min-width:980px){.logo{width:122px}.brand h1{font-size:19px}.fields{grid-template-columns:1.25fr 1fr 1.25fr .8fr}.grid{grid-template-columns:repeat(3,1fr)}.card{grid-template-columns:70px minmax(0,1fr);padding:14px}.avatar{width:70px;height:70px}}
</style></head><body>
